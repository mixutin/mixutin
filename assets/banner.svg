<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">mixutin</title>
  <desc id="banner-desc">mixutin: cybersecurity specialist, CTF player and reverse engineer. Game preservation, binary analysis, backend and servers, systems programming, game dev and tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="1" stop-color="#101826"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.10"/>
    </pattern>
    <pattern id="crt" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" fill-opacity="0.025"/>
    </pattern>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="298" rx="14"/>
    </clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, "DejaVu Sans", sans-serif; }
    .cursor { animation: blink 1.1s steps(1, end) infinite; }
    .scan { animation: scan 7s linear infinite; }
    .step { animation: step 4.8s steps(1, end) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(420px); } }
    @keyframes step {
      0% { transform: translateY(0); }
      25% { transform: translateY(24px); }
      50% { transform: translateY(48px); }
      75% { transform: translateY(72px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .scan, .step { animation: none; }
      .scan { display: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>

    <!-- window bar -->
    <rect width="1200" height="40" fill="#0d131c"/>
    <rect y="40" width="1200" height="1" fill="#1e2a3a"/>
    <circle cx="26" cy="20" r="6" fill="#f87171"/>
    <circle cx="46" cy="20" r="6" fill="#fbbf24"/>
    <circle cx="66" cy="20" r="6" fill="#34d399"/>
    <text x="600" y="25" text-anchor="middle" class="mono" font-size="13" fill="#64748b">mixutin@github: ~</text>

    <!-- prompt and handle -->
    <text x="56" y="92" class="mono" font-size="20"><tspan fill="#2dd4bf">$</tspan><tspan x="78" fill="#94a3b8">whoami</tspan></text>
    <text x="52" y="172" class="mono" font-size="80" font-weight="700" fill="#f1f5f9" textLength="336" lengthAdjust="spacingAndGlyphs">mixutin</text>
    <rect class="cursor" x="402" y="114" width="34" height="64" fill="#2dd4bf"/>

    <!-- identity -->
    <text x="56" y="222" class="sans" font-size="24" fill="#e2e8f0">Cybersecurity specialist · CTF player · reverse engineer</text>
    <text x="56" y="258" class="mono" font-size="14" fill="#64748b">game preservation · binary analysis · backend &amp; servers · systems programming · game dev &amp; tools</text>

    <!-- disassembly panel (original decoration) -->
    <rect x="770" y="58" width="394" height="142" rx="10" fill="#0b1119" stroke="#1e2a3a"/>
    <rect class="step" x="771" y="70" width="392" height="22" fill="#2dd4bf" fill-opacity="0.10"/>
    <g class="mono" font-size="13">
      <text y="86"><tspan x="786" fill="#475569">140001000</tspan><tspan x="872" fill="#64748b">48 89 5C 24 08</tspan><tspan x="996" fill="#5eead4">mov</tspan><tspan x="1040" fill="#cbd5e1">[rsp+8], rbx</tspan></text>
      <text y="110"><tspan x="786" fill="#475569">140001005</tspan><tspan x="872" fill="#64748b">57</tspan><tspan x="996" fill="#5eead4">push</tspan><tspan x="1040" fill="#cbd5e1">rdi</tspan></text>
      <text y="134"><tspan x="786" fill="#475569">140001006</tspan><tspan x="872" fill="#64748b">48 83 EC 20</tspan><tspan x="996" fill="#5eead4">sub</tspan><tspan x="1040" fill="#cbd5e1">rsp, 20h</tspan></text>
      <text y="158"><tspan x="786" fill="#475569">14000100A</tspan><tspan x="872" fill="#64748b">E8 F1 0F 00 00</tspan><tspan x="996" fill="#5eead4">call</tspan><tspan x="1040" fill="#cbd5e1">sub_140002000</tspan></text>
      <text y="182"><tspan x="786" fill="#475569">14000100F</tspan><tspan x="872" fill="#fbbf24" fill-opacity="0.9">; flag{keep_games_alive}</tspan></text>
    </g>

    <text x="1164" y="284" text-anchor="end" class="mono" font-size="13" fill="#334155">github.com/mixutin</text>

    <!-- scanline and CRT texture -->
    <rect class="scan" y="-60" width="1200" height="60" fill="url(#beam)"/>
    <rect width="1200" height="300" fill="url(#crt)"/>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="14" fill="none" stroke="#1e2a3a" stroke-width="2"/>
</svg>
